name: AgentIDE
options:
  bundleIdPrefix: com.mikemcquaid
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "27.0"
packages:
  AgentIDEPackage:
    path: .
targets:
  AgentIDEApp:
    type: application
    platform: macOS
    sources:
      - App
      # A folder reference, so the shim keeps its name, its place and
      # its executable bit inside Resources; a shell pane puts this
      # directory on its PATH.
      - path: bin
        type: folder
        buildPhase: resources
    dependencies:
      - package: AgentIDEPackage
        product: DashboardFeature
      - package: AgentIDEPackage
        product: SessionFeature
      - package: AgentIDEPackage
        product: ReviewFeature
      - package: AgentIDEPackage
        product: PRFeature
      - package: AgentIDEPackage
        product: TerminalUI
      - package: AgentIDEPackage
        product: AgentIDEData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikemcquaid.AgentIDE
        PRODUCT_NAME: AgentIDE
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Mike McQuaid."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: App/AgentIDE.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - AgentIDEIntentTests
  # The App Intents exercised through the system's own runtime, out
  # of process: a UI testing bundle is what AppIntentsTesting wants.
  # Host and CI only, since xcodebuild cannot run in the sandbox.
  AgentIDEIntentTests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/AgentIDEIntentTests
    dependencies:
      - target: AgentIDEApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
