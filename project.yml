name: AgentIDE
options:
  bundleIdPrefix: com.mikemcquaid
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "27.0"
packages:
  AgentIDEPackage:
    path: .
settings:
  base:
    SUPPRESS_WARNINGS: NO
    SWIFT_SUPPRESS_WARNINGS: NO
    GCC_WARN_INHIBIT_ALL_WARNINGS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_MEMORY_SAFETY: YES
    OTHER_SWIFT_FLAGS: $(inherited) -warn-implicit-overrides
    OTHER_LDFLAGS: $(inherited) -Wl,-fatal_warnings
    OTHER_CFLAGS: $(inherited) -Weverything
    OTHER_CPLUSPLUSFLAGS: $(inherited) -Weverything
    RUN_CLANG_STATIC_ANALYZER: YES
    CLANG_STATIC_ANALYZER_MODE: deep
    CLANG_ANALYZER_OTHER_FLAGS: $(inherited) -Xclang -analyzer-werror
    # Enable the optional checks alongside Xcode's default checks.
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_ANALYZER_OSOBJECT_C_STYLE_CAST: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_ANALYZER_LOCALIZABILITY_EMPTY_CONTEXT: YES
    CLANG_ANALYZER_GCD_PERFORMANCE: YES
    CLANG_ANALYZER_SECURITY_FLOATLOOPCOUNTER: YES
    CLANG_ANALYZER_SECURITY_INSECUREAPI_RAND: YES
    CLANG_ANALYZER_SECURITY_INSECUREAPI_STRCPY: YES
    CLANG_ANALYZER_SECURITY_BUFFER_OVERFLOW_EXPERIMENTAL: YES
targets:
  AgentIDEApp:
    type: application
    platform: macOS
    sources:
      - App
      # A folder reference, so the shim keeps its name, its place and
      # its executable bit inside Resources; a shell pane puts this
      # directory on its PATH.
      - path: bin
        type: folder
        buildPhase: resources
    dependencies:
      - package: AgentIDEPackage
        product: DashboardFeature
      - package: AgentIDEPackage
        product: SessionFeature
      - package: AgentIDEPackage
        product: ReviewFeature
      - package: AgentIDEPackage
        product: PRFeature
      - package: AgentIDEPackage
        product: TerminalUI
      - package: AgentIDEPackage
        product: AgentIDEData
    # The version and build number come from git through
    # `script/version`, which writes this before the project is
    # generated and before every scripted build; a build started in
    # Xcode reads the same file, so it is versioned the same way.
    configFiles:
      Debug: .build/version.xcconfig
      Release: .build/version.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikemcquaid.AgentIDE
        PRODUCT_NAME: AgentIDE
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Mike McQuaid."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # macOS has no way to decline these prompts in advance: a
        # non-sandboxed app is asked the first time it touches one of
        # these places, and these strings are only what the prompt
        # says. AgentIDE reaches them for one reason, so the prompt
        # says which directory of your own asked and offers the
        # honest way out.
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: >-
          AgentIDE reads a directory you listed yourself. Deny this and remove
          the directory from its repository's menu if you would rather it never
          looked.
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: >-
          AgentIDE reads a directory you listed yourself. Deny this and remove
          the directory from its repository's menu if you would rather it never
          looked.
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: >-
          AgentIDE reads a directory you listed yourself. Deny this and remove
          the directory from its repository's menu if you would rather it never
          looked.
        INFOPLIST_KEY_NSNetworkVolumesUsageDescription: >-
          AgentIDE reads a directory you listed yourself, or a repository on a
          share. Deny this and keep your work on a local disk if you would
          rather it never looked.
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: >-
          AgentIDE reads a directory you listed yourself, or a repository on a
          removable disk. Deny this and keep your work on the internal disk if
          you would rather it never looked.
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: App/AgentIDE.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - AgentIDEIntentTests
  # The App Intents exercised through the system's own runtime, out
  # of process: a UI testing bundle is what AppIntentsTesting wants.
  # Host and CI only, since xcodebuild cannot run in the sandbox.
  AgentIDEIntentTests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/AgentIDEIntentTests
    dependencies:
      - target: AgentIDEApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
