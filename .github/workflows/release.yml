name: Release

on:
  # Run from `main` to release the current commit at its version.
  workflow_dispatch:
    inputs:
      version:
        description: Bare MAJOR.MINOR.PATCH version, for example 0.1.0
        required: true
        type: string
  # Dry run whenever the release process itself changes, so it cannot
  # rot unnoticed between releases.
  push:
    paths:
      - .github/workflows/release.yml
      - App/AgentIDE.entitlements
      - project.yml
      - script/build
      - script/package
      - script/zip

defaults:
  run:
    shell: bash -xeuo pipefail {0}

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: write # to push the tag and create the release
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The version needs tags and the build number counts commits.
          fetch-depth: 0

      - name: Check the branch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main, not ${GITHUB_REF}."
          exit 1

      - name: Create local version tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${RELEASE_VERSION}"
            if [[ "${version}" == "0.0.0" || "${version}" == "9999.0.0" ]]; then
              echo "::error::Version ${version} is reserved for development and dry runs."
              exit 1
            fi
          else
            version="9999.0.0"
          fi
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be bare MAJOR.MINOR.PATCH, for example 0.1.0."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/${version}"; then
            echo "::error::Tag ${version} already exists."
            exit 1
          fi
          if [[ -n "$(git tag --points-at HEAD)" ]]; then
            echo "::error::The current commit already has a tag."
            exit 1
          fi
          git tag "${version}"
          [[ "$(git describe --tags --exact-match HEAD)" == "${version}" ]]
          echo "VERSION=${version}" >>"${GITHUB_ENV}"

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
        with:
          core: false
          cask: false
          test-bot: false

      - name: Select Xcode 27
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*27*.app' -print -quit)"
          if [[ -z "${xcode}" ]]; then
            echo "::error::Xcode 27 is not installed on this runner image."
            exit 1
          fi
          sudo xcode-select -s "${xcode}/Contents/Developer"
          xcodebuild -version

      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Bootstrap
        run: script/bootstrap

      - name: Build
        env:
          XCODE_CONFIGURATION: Release
        run: script/build

      - name: Zip
        run: script/zip

      - name: Sign and notarise
        # Human dry runs test the credentials too. Dependabot cannot
        # read Actions secrets, while a release must fail without them.
        if: github.event_name == 'workflow_dispatch' || github.actor != 'dependabot[bot]'
        env:
          DEVELOPER_ID_APPLICATION_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          NOTARIZATION_KEY: ${{ secrets.NOTARIZATION_KEY }}
          NOTARIZATION_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          NOTARIZATION_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
        run: script/package

      - name: Upload the app
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AgentIDE
          path: .build/AgentIDE-*.zip
          # The zip lives in a hidden directory, skipped by default.
          include-hidden-files: true
          if-no-files-found: error

      - name: Check releases in a dry run
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release list

      - name: Create the release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin "refs/tags/${VERSION}"
          gh release create "${VERSION}" --verify-tag --generate-notes \
            ".build/AgentIDE-${VERSION}.zip"

  bump-cask:
    # `HOMEBREW_GITHUB_API_TOKEN` is a classic personal access token
    # with `public_repo` alone, never `workflow`. `brew bump` pushes
    # the bump to a fork under the token's account and opens the pull
    # request from there; that push carries every upstream commit the
    # fork lacks, and GitHub refuses one that touched a workflow file
    # without the `workflow` scope, so the fork is brought up to date
    # first by moving its main to upstream's, server-side. When GitHub
    # refuses that too (it applies the same rule to merge-upstream),
    # the bump pushes its one commit straight to Homebrew/homebrew-cask
    # instead, which carries nothing but the bump. A dry run walks the
    # same steps with nothing to bump, so the token, the fork and the
    # sync are proven on every change here. Without the secret (a
    # fork of this repository, Dependabot) every step skips.
    needs: release
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
    steps:
      - name: Check the token's account, scope and fork
        if: env.HOMEBREW_GITHUB_API_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.HOMEBREW_GITHUB_API_TOKEN }}
        run: |
          login="$(gh api user --jq .login)"
          scopes="$(gh api -i user | tr -d '\r' | grep -i '^x-oauth-scopes:' | cut -d: -f2-)"
          echo "token belongs to ${login} with scopes:${scopes}"
          if [[ "${scopes}" != *public_repo* && "${scopes}" != *" repo"* ]]; then
            echo "::error::HOMEBREW_GITHUB_API_TOKEN lacks the public_repo scope"
            exit 1
          fi
          if [[ "${scopes}" == *workflow* ]]; then
            echo "::error::HOMEBREW_GITHUB_API_TOKEN carries the workflow scope, which nothing here needs"
            exit 1
          fi
          if [[ "$(gh api "repos/${login}/homebrew-cask" --jq .fork 2>/dev/null)" != "true" ]]; then
            echo "::notice::${login} has no fork of Homebrew/homebrew-cask; the bump will push to it directly"
            echo "bump_fork=false" >>"${GITHUB_ENV}"
            exit 0
          fi
          echo "fork=${login}/homebrew-cask" >>"${GITHUB_ENV}"

      - name: Bring the fork up to date
        if: env.HOMEBREW_GITHUB_API_TOKEN != '' && env.fork != ''
        env:
          GH_TOKEN: ${{ env.HOMEBREW_GITHUB_API_TOKEN }}
        run: |
          upstream="$(gh api repos/Homebrew/homebrew-cask/git/ref/heads/main --jq .object.sha)"
          current="$(gh api "repos/${fork}/git/ref/heads/main" --jq .object.sha)"
          if [[ "${current}" == "${upstream}" ]]; then
            echo "${fork} is at upstream's main already"
            echo "bump_fork=true" >>"${GITHUB_ENV}"
            exit 0
          fi
          # A fast-forward of the fork's main to a commit upstream
          # already holds, then the merge-upstream route; either is
          # refused with `workflow` in its message when upstream
          # touched a workflow file since the fork last caught up.
          if gh api -X PATCH "repos/${fork}/git/refs/heads/main" -f "sha=${upstream}" -F force=false \
              --jq .object.sha 2>"${RUNNER_TEMP}/sync.err" \
            || gh repo sync "${fork}" --branch main 2>>"${RUNNER_TEMP}/sync.err"; then
            echo "${fork} brought up to ${upstream}"
            echo "bump_fork=true" >>"${GITHUB_ENV}"
          elif grep -qi workflow "${RUNNER_TEMP}/sync.err"; then
            cat "${RUNNER_TEMP}/sync.err"
            echo "::notice::${fork} cannot be brought up to date without the workflow scope; the bump will push to Homebrew/homebrew-cask directly"
            echo "bump_fork=false" >>"${GITHUB_ENV}"
          else
            cat "${RUNNER_TEMP}/sync.err"
            exit 1
          fi

      - name: Set up Homebrew
        if: env.HOMEBREW_GITHUB_API_TOKEN != '' && github.event_name == 'workflow_dispatch'
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
        with:
          core: false
          cask: true
          test-bot: false

      - name: Bump the cask
        if: env.HOMEBREW_GITHUB_API_TOKEN != '' && github.event_name == 'workflow_dispatch'
        uses: Homebrew/actions/bump-packages@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
        with:
          token: ${{ env.HOMEBREW_GITHUB_API_TOKEN }}
          casks: agentide
          fork: ${{ env.bump_fork != 'false' }}
