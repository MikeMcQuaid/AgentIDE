name: Release

on:
  # Run from `main` to release the current commit at its version.
  workflow_dispatch:
    inputs:
      version:
        description: Bare MAJOR.MINOR.PATCH version, for example 0.1.0
        required: true
        type: string
  # Dry run whenever the release process itself changes, so it cannot
  # rot unnoticed between releases.
  push:
    paths:
      - .github/workflows/release.yml
      - App/Sanductor.entitlements
      - Package.swift
      - Package.resolved
      - project.yml
      - script/bootstrap
      - script/build
      - script/package
      - script/testflight
      - iOSApp/PrivacyInfo.xcprivacy
      - script/project
      - script/version
      - script/zip

defaults:
  run:
    shell: bash -xeuo pipefail {0}

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The version needs tags and the build number counts commits.
          fetch-depth: 0

      - name: Check the branch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main, not ${GITHUB_REF}."
          exit 1

      - name: Create local version tag
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${RELEASE_VERSION}"
            if [[ "${version}" == "0.0.0" || "${version}" == "9999.0.0" ]]; then
              echo "::error::Version ${version} is reserved for development and dry runs."
              exit 1
            fi
          else
            version="9999.0.0"
          fi
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be bare MAJOR.MINOR.PATCH, for example 0.1.0."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/${version}"; then
            echo "::error::Tag ${version} already exists."
            exit 1
          fi
          if [[ -n "$(git tag --points-at HEAD)" ]]; then
            echo "::error::The current commit already has a tag."
            exit 1
          fi
          git tag "${version}"
          [[ "$(git describe --tags --exact-match HEAD)" == "${version}" ]]
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false

      - name: Select Xcode 27
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*27*.app' -print -quit)"
          if [[ -z "${xcode}" ]]; then
            echo "::error::Xcode 27 is not installed on this runner image."
            exit 1
          fi
          sudo xcode-select -s "${xcode}/Contents/Developer"
          xcodebuild -version

      - name: Ensure Metal toolchain
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift package dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm/repositories
          key: ${{ runner.os }}-swiftpm-repositories-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-repositories-

      - name: Bootstrap
        run: script/bootstrap gh xcodegen

      - name: Build
        run: script/build

      - name: Sign and notarise
        id: package
        # Human dry runs test the credentials too. Dependabot cannot
        # read Actions secrets, while a release must fail without them.
        if: github.event_name == 'workflow_dispatch' || github.actor != 'dependabot[bot]'
        env:
          DEVELOPER_ID_APPLICATION_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          NOTARIZATION_KEY: ${{ secrets.NOTARIZATION_KEY }}
          NOTARIZATION_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          NOTARIZATION_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
        run: script/package

      - name: Zip
        if: steps.package.outcome == 'skipped'
        run: script/zip

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sanductor
          path: .build/Sanductor-${{ steps.version.outputs.version }}.zip
          # The zip lives in a hidden directory, skipped by default.
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Check releases in a dry run
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release list --repo "${GITHUB_REPOSITORY}"

  smoke-test:
    name: test (macOS ${{ matrix.macos }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            macos: "26"
          - runner: xcode-27
            macos: "27"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Check runtime platform
        env:
          EXPECTED_MACOS: ${{ matrix.macos }}
        run: |
          sw_vers
          [[ "$(sw_vers -productVersion | cut -d. -f1)" == "${EXPECTED_MACOS}" && "$(uname -m)" == arm64 ]]

      - name: Download app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Sanductor
          path: .test-scratch

      - name: Launch app
        run: |
          ditto -x -k .test-scratch/Sanductor-*.zip .test-scratch
          .test-scratch/Sanductor.app/Contents/MacOS/Sanductor &
          pid=$!
          trap 'kill "${pid}" &>/dev/null || true' EXIT
          sleep 10
          kill -0 "${pid}"

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, smoke-test, testflight]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # to push the tag and create the release
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Sanductor
          path: .build

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "${VERSION}" "${GITHUB_SHA}"
          gh auth setup-git
          git push origin "refs/tags/${VERSION}"
          gh release create "${VERSION}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes \
            ".build/Sanductor-${VERSION}.zip"

  testflight:
    name: TestFlight (iPhone)
    if: github.actor != 'dependabot[bot]'
    needs: [build, smoke-test]
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false

      - name: Select Xcode 27
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*27*.app' -print -quit)"
          if [[ -z "${xcode}" ]]; then
            echo "::error::Xcode 27 is not installed on this runner image."
            exit 1
          fi
          sudo xcode-select -s "${xcode}/Contents/Developer"
          xcodebuild -version

      - name: Ensure Metal toolchain
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift package dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm/repositories
          key: ${{ runner.os }}-swiftpm-repositories-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-repositories-

      - name: Bootstrap
        run: script/bootstrap xcodegen

      - name: Archive, sign and validate or upload
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          APP_STORE_KEY: ${{ secrets.NOTARIZATION_KEY }}
          APP_STORE_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
          APP_STORE_CERTIFICATES: ${{ secrets.APP_STORE_CERTIFICATES }}
          APP_STORE_CERTIFICATES_PASSWORD: ${{ secrets.APP_STORE_CERTIFICATES_PASSWORD }}
          SANDUCTOR_APP_STORE_IOS_PROFILE: ${{ secrets.SANDUCTOR_APP_STORE_IOS_PROFILE }}
          AGENTIDE_APP_STORE_IOS_PROFILE: ${{ secrets.AGENTIDE_APP_STORE_IOS_PROFILE }}
        run: |
          [[ -n "${SANDUCTOR_APP_STORE_IOS_PROFILE:+set}" ]] || unset SANDUCTOR_APP_STORE_IOS_PROFILE
          [[ -n "${AGENTIDE_APP_STORE_IOS_PROFILE:+set}" ]] || unset AGENTIDE_APP_STORE_IOS_PROFILE
          if [[ "${GITHUB_EVENT_NAME}" == push ]]; then
            script/testflight --dry-run
          else
            script/testflight
          fi
