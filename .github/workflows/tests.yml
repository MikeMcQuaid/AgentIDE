name: GitHub Actions CI

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash -xeuo pipefail {0}

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          core: false
          cask: false

      - name: Bootstrap
        run: script/bootstrap

      - name: Check style
        run: script/style

  tests:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # Forks and Dependabot have no secrets. Check only the certificate
      # so script/package fails if the remaining credentials are missing.
      HAS_SIGNING_SECRETS: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE != '' }}
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          core: false
          cask: false

      - name: Select Xcode 27
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*27*.app' -print -quit)"
          if [[ -z "${xcode}" ]]; then
            echo "::error::Xcode 27 is not installed on this runner image."
            exit 1
          fi
          sudo xcode-select -s "${xcode}/Contents/Developer"
          xcodebuild -version

      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift package dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .DerivedData/SourcePackages
            .build/checkouts
            .build/repositories
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-

      - name: Bootstrap
        run: script/bootstrap

      - name: Build
        run: script/build

      - name: Build iPhone app
        run: >-
          xcodebuild -project AgentIDE.xcodeproj -scheme AgentIDE-iOS
          -configuration Release -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .DerivedData-iOS -skipPackagePluginValidation
          -disableAutomaticPackageResolution ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

      - name: Zip
        run: script/zip

      - name: Sign and notarise
        if: env.HAS_SIGNING_SECRETS == 'true'
        env:
          DEVELOPER_ID_APPLICATION_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          NOTARIZATION_KEY: ${{ secrets.NOTARIZATION_KEY }}
          NOTARIZATION_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          NOTARIZATION_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
        run: script/package

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AgentIDE
          path: .build/AgentIDE-*.zip
          # The zip lives in a hidden directory, skipped by default.
          include-hidden-files: true
          if-no-files-found: error

      - name: Test with Thread Sanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: script/test --sanitize thread --scratch-path .build/thread-sanitizer

      - name: Test terminal and parser integrations with Address Sanitizer
        env:
          ASAN_OPTIONS: halt_on_error=1
        run: script/test --sanitize address --scratch-path .build/address-sanitizer --test-product TerminalUITests

  analyze:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          core: false
          cask: false

      - name: Select Xcode 27
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*27*.app' -print -quit)"
          if [[ -z "${xcode}" ]]; then
            echo "::error::Xcode 27 is not installed on this runner image."
            exit 1
          fi
          sudo xcode-select -s "${xcode}/Contents/Developer"
          xcodebuild -version

      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift package dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .DerivedData/SourcePackages
            .build/checkouts
            .build/repositories
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-

      - name: Bootstrap
        run: script/bootstrap

      - name: Analyze
        run: script/analyze

# `style`, `tests` and `analyze` always run, so they are the required
# checks in branch protection directly. If any job ever becomes
# conditionally skipped (a job-level `if:`, a path filter, or a
# matrix), add back an aggregating `check` job with `if: always()`
# that fails unless every `needs` job succeeded and require that
# instead: branch protection handles a skipped required-by-name check
# poorly.
