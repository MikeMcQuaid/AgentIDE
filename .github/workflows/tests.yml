name: GitHub Actions CI

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash -xeuo pipefail {0}

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          core: false
          cask: false
          test-bot: false

      - name: Bootstrap
        run: script/bootstrap

      - name: Check style
        run: script/style

  tests:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          core: false
          cask: false
          test-bot: false

      - name: Select Xcode 27
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*27*.app' -print -quit)"
          if [[ -z "${xcode}" ]]; then
            echo "::error::Xcode 27 is not installed on this runner image."
            exit 1
          fi
          sudo xcode-select -s "${xcode}/Contents/Developer"
          xcodebuild -version

      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift package dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .DerivedData/SourcePackages
            .build/checkouts
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-

      - name: Bootstrap
        run: script/bootstrap

      - name: Build
        run: script/build

      - name: Test
        run: script/test

  analyze:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          core: false
          cask: false
          test-bot: false

      - name: Select Xcode 27
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*27*.app' -print -quit)"
          if [[ -z "${xcode}" ]]; then
            echo "::error::Xcode 27 is not installed on this runner image."
            exit 1
          fi
          sudo xcode-select -s "${xcode}/Contents/Developer"
          xcodebuild -version

      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift package dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .DerivedData/SourcePackages
            .build/checkouts
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-

      - name: Bootstrap
        run: script/bootstrap

      - name: Analyze
        run: script/analyze

# `style`, `tests` and `analyze` always run, so they are the required
# checks in branch protection directly. If any job ever becomes
# conditionally skipped (a job-level `if:`, a path filter, or a
# matrix), add back an aggregating `check` job with `if: always()`
# that fails unless every `needs` job succeeded and require that
# instead: branch protection handles a skipped required-by-name check
# poorly.
