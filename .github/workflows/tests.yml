name: GitHub Actions CI

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash -xeuo pipefail {0}

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  style:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false

      - name: Install style tools
        run: brew install actionlint shellcheck shfmt swiftformat swiftlint zizmor

      - name: Check style
        run: script/style

  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        task: [thread, address]
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false

      - name: Select Xcode 27.2 or later
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*27*.app' -print | sort -rV | head -1)"
          if [[ -z "${xcode}" ]]; then
            echo "::error::Xcode 27.2 or later is not installed on this runner image."
            exit 1
          fi
          sudo xcode-select -s "${xcode}/Contents/Developer"
          xcodebuild -version
          xcodebuild -version | awk '/^Xcode / { split($2, v, "."); exit !(v[1] > 27 || (v[1] == 27 && v[2] >= 2)) }'

      - name: Ensure Metal toolchain
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift package dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm/repositories
          key: ${{ runner.os }}-swiftpm-repositories-${{ hashFiles('Package.resolved', 'Sanductor.xcodeproj/project.xcproj', 'Sanductor.xcodeproj/xcshareddata/xcschemes/*.xcscheme') }}
          restore-keys: ${{ runner.os }}-swiftpm-repositories-

      - name: Bootstrap tests
        run: script/bootstrap gh herdr ripgrep swiftlint

      - name: Test with Thread Sanitizer
        if: matrix.task == 'thread'
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: script/test --sanitize thread --scratch-path .build/thread-sanitizer

      - name: Test terminal and parser integrations with Address Sanitizer
        if: matrix.task == 'address'
        env:
          ASAN_OPTIONS: halt_on_error=1
        run: script/test --sanitize address --scratch-path .build/address-sanitizer --test-product TerminalUITests

  # Keep the required check's name stable and reject failed or skipped jobs.
  tests:
    if: always()
    needs: [build-and-test, analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check builds and sanitizers
        env:
          RESULT: ${{ needs.build-and-test.result }}
          ANALYSIS_RESULT: ${{ needs.analyze.result }}
        run: test "${RESULT}" = success && test "${ANALYSIS_RESULT}" = success

  analyze:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # Forks and Dependabot have no secrets. Check only the certificate
      # so script/package fails if the remaining credentials are missing.
      HAS_SIGNING_SECRETS: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE != '' }}
      XCODE_CONFIGURATION: Release
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false

      - name: Select Xcode 27.2 or later
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode*27*.app' -print | sort -rV | head -1)"
          if [[ -z "${xcode}" ]]; then
            echo "::error::Xcode 27.2 or later is not installed on this runner image."
            exit 1
          fi
          sudo xcode-select -s "${xcode}/Contents/Developer"
          xcodebuild -version
          xcodebuild -version | awk '/^Xcode / { split($2, v, "."); exit !(v[1] > 27 || (v[1] == 27 && v[2] >= 2)) }'

      - name: Ensure Metal toolchain
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift package dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm/repositories
          key: ${{ runner.os }}-swiftpm-repositories-${{ hashFiles('Package.resolved', 'Sanductor.xcodeproj/project.xcproj', 'Sanductor.xcodeproj/xcshareddata/xcschemes/*.xcscheme') }}
          restore-keys: ${{ runner.os }}-swiftpm-repositories-

      - name: Bootstrap
        run: script/bootstrap periphery ripgrep swiftlint

      - name: Build and analyze both apps
        env:
          SANDUCTOR_ANALYZE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          test -n "${SANDUCTOR_ANALYZE_BASE}"
          script/analyze

      # Reuse analysis's clean Release build when finishing the signed app.
      - name: Finish app build
        run: script/build

      - name: Zip
        if: env.HAS_SIGNING_SECRETS != 'true'
        run: script/zip

      - name: Sign and notarise
        if: env.HAS_SIGNING_SECRETS == 'true'
        env:
          DEVELOPER_ID_APPLICATION_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          NOTARIZATION_KEY: ${{ secrets.NOTARIZATION_KEY }}
          NOTARIZATION_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          NOTARIZATION_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
        run: script/package

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sanductor
          path: .build/Sanductor-*.zip
          # The zip lives in a hidden directory, skipped by default.
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0

# `style`, `tests` and `analyze` remain the required checks.
